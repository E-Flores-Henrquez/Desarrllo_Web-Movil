<!DOCTYPE html>
<html>
    <head>
        <script>
            const responseAPI = {
                "status": 200,
                "message": "Productos Obtenidos",
                "data": [{"id":"1","nombre":"Martillo"},{"id":"2","nombre":"Tijera"}]
            };

            const metadata = {
                titulo: "Catálogo de productos",
                prefijo: "Producto:"
            };

            const vista = { metadata, responseAPI };

            function cargarProductos(){
                document.getElementById("titulo").innerText = vista.metadata.titulo;

                let cmb = document.getElementById("cmbProducto");
                vista.responseAPI.data.forEach((prod) => {
                    let opt = document.createElement("option");
                    opt.setAttribute("value", prod.id);
                    opt.innerText = `${vista.metadata.prefijo} ${prod.nombre}`;
                    cmb.appendChild(opt);
                });
            }
        </script>
    </head>
    <body onload="cargarProductos();">
        <h3 id="titulo"></h3>
        <div>
            <select id="cmbProducto" name="cmbProducto"></select>
        </div>
    </body>
</html>
